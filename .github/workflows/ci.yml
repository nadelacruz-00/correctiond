name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      # SQLCipher links the system libcrypto.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-default-features
      - run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config ibus python3-gi gir1.2-ibus-1.0 dbus gjs unzip
      - run: cargo build --release --locked
      # scripts/e2e.sh runs inside dbus-run-session with a private ibus-daemon.
      - run: bash scripts/e2e.sh
      - run: python3 -m unittest discover scripts
      - run: gjs -m extension/test/lib.test.js
      # test/prefs.smoke.js needs a display and libadwaita >= 1.7: desktop only.
      - run: gjs -m extension/test/config.test.js
