[package]
name = "corelib"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
getrandom = "0.3"
zeroize = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "decide"
harness = false

[[bench]]
name = "write"
harness = false
